name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        # The test suite does not import Flower/Ray/torch, so we install the
        # package without its heavy runtime deps and add only what the tests
        # actually need. This keeps CI fast and proves the crate-building core
        # works without a Flower install.
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov "rocrate>=0.15" "roc-validator>=0.13" "tomli>=2.0; python_version < '3.11'"
          pip install -e . --no-deps
      
      - name: Cache the validator's profile resources
        # The tests validate with offline=True, which only reads rocrate-validator's
        # cache. A fresh runner's cache is empty, so fill it first.
        run: rocrate-validator cache warm -p ro-crate-1.2 -p process-run-crate-0.5

      - name: Run tests with coverage
        run: pytest -q --cov=flwrcrate --cov-report=term-missing --cov-fail-under=85
